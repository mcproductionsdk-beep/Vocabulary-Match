.match-layout .columns{grid-area:1 / 1;min-width:0}
.rescue{grid-area:1 / 2;position:relative;min-height:240px;background:#14284a;border:3px solid #0c1938;--rise:0%}
.park{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tree{position:absolute;right:0;bottom:0;width:66%;height:100%;pointer-events:none}
.tree svg{width:100%;height:100%}
.platform{position:absolute;bottom:65%;left:49%;width:30%;height:5px;background:#8f5b38}
.cat{position:absolute;bottom:5px;left:45%;width:clamp(18px,3vw,30px);line-height:0}
.girl{position:absolute;bottom:var(--rise);left:50%;transform:translateX(-50%);width:clamp(23px,4vw,44px);line-height:0;transition:bottom .35s;z-index:1}
.girl svg,.cat svg{width:100%;height:auto}
.hug,.rescued .cat{display:none}
.rescued .hug{display:block;position:absolute;top:36%;left:40%;width:68%;animation:pickup .35s ease-out}
@keyframes pickup{from{transform:translate(45%,35%)}to{transform:none}}
.tower{position:absolute;bottom:0;left:25%;width:50%;height:65%;display:flex;flex-direction:column-reverse;align-items:stretch}
.tower-block{height:calc(100% / var(--pairs,6));background:repeating-linear-gradient(0deg,#855035 0 2px,#a36c43 2px 6px);color:#332117;border:2px solid #4e3022;text-align:center;font-size:11px;overflow:hidden}

@media(max-width:720px){.tower-block span{font-size:clamp(10px,3vw,14px)}}

.match-card[data-side=target]{background:#9edfed}

.match-card.matched{visibility:hidden}
.rescue-result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#10192edd;padding:12px}
.rescue-result[hidden]{display:none}
.rescue-result-card{display:grid;justify-items:center;gap:8px;width:min(100%,490px);padding:12px;border:4px solid #f2d64b;background:#203a67}
.rescue-result-card h2{margin:0;color:#f2d64b;text-align:center}
.rescue-portrait{display:block;width:100%;max-height:55dvh;border:3px solid #101a43}
#nextBoard{margin:0;min-height:44px}
@media(max-width:720px){
 .match-layout{display:flex;flex-direction:column;gap:4px}
 .rescue{min-height:116px}
 .match-card{font-size:clamp(11px,3.5vw,15px)}
}
.shell-managed .logo,.shell-managed #game .buttons,.embedded #testStart{display:none!important}

 E("tower").replaceChildren();
 E("rescue").style.setProperty("--rise","0%");
 E("rescue").classList.remove("rescued");
 E("rescueResult").hidden=true;
 E("status").textContent="";
 for(const [column,words,side,key] of [
   ["english",set,"prompt","english"],["targetWords",shuffle(set),"target","target"]
 ]){
   E(column).replaceChildren(...words.map(pair=>{
     const card=document.createElement("div");
     card.className="match-card";
     card.dataset.side=side;
     card.dataset.pair=pair.id;
     card.textContent=pair[key];
     return card;
   }));
 }
 hud();
}
function matchCards(card,other){
 if(!other||card.dataset.side===other.dataset.side)return;
 const id=Number(card.dataset.pair);
 if(card.dataset.pair!==other.dataset.pair){
   E("status").textContent="NOPE";
   E("status").style.color="#ff6a80";
   card.animate([{background:"#a92e48"},{background:""}],{duration:350});
   const notice=++noticeId;
   later(()=>{if(notice===noticeId)E("status").textContent=""},650);
   bad();
   return;
 }
 noticeId++;
 matched.add(id);
 const word=vocab[id].target;
 const from=other.getBoundingClientRect();
 card.classList.add("matched");other.classList.add("matched");
 const block=document.createElement("div");
 block.className="tower-block";
 const plaque=document.createElement("span");
 plaque.textContent=word;
 block.append(plaque);
 E("tower").append(block);
 const to=block.getBoundingClientRect();
 block.animate([{transform:`translate(${from.left-to.left}px,${from.top-to.top}px)`,opacity:.4},{transform:"none",opacity:1}],{duration:350});
 E("rescue").style.setProperty("--rise",matched.size/boardSize*65+"%");
 E("rescueGirl").animate([{transform:"translate(-50%,0)"},{transform:"translate(-50%,-9px)"},{transform:"translate(-50%,0)"}],{duration:350});
 score+=10;
 E("status").textContent="✓ "+word;
 E("status").style.color="#78df62";
 good();speak(word);hud();
 if(matched.size===boardSize)later(()=>{
   E("rescue").classList.add("rescued");
   E("status").textContent="";
   E("nextBoard").textContent=setIndex+SET>=order.length?"PLAY NEXT ROUND":"NEXT BOARD";
   E("rescueResult").hidden=false;
   E("nextBoard").focus();
 },400);
}
let noticeId=0;
E("nextBoard").onclick=function(){
 if(E("rescueResult").hidden)return;
 setIndex+=SET;
 if(setIndex>=order.length){order=shuffle(vocab);setIndex=0}
 renderSet();
};
const matchBoard=E("board");
matchBoard.addEventListener("pointerdown",e=>{
 const card=e.target.closest(".match-card:not(.matched)");
 if(!card||drag||paused||e.button!==0)return;
 drag={card,id:e.pointerId,x:e.clientX,y:e.clientY};
 card.classList.add("dragging");
 matchBoard.setPointerCapture(e.pointerId);
});
matchBoard.addEventListener("pointermove",e=>{
 if(drag?.id!==e.pointerId)return;
 drag.card.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px)`;
});
matchBoard.addEventListener("pointerup",e=>{
 if(drag?.id!==e.pointerId)return;
 const card=drag.card;
 cancelDrag();
 const target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".match-card:not(.matched)");
 if(!paused)matchCards(card,target);
});
for(const type of ["pointercancel","lostpointercapture"]){
 matchBoard.addEventListener(type,e=>{if(drag?.id===e.pointerId)cancelDrag()});
}
function toMenu(){
 if(subscriber){subscriber({type:"BT_MATCH_MENU"});return}
 E("rescueResult").hidden=true;
 resetPause();
 E("testStart").hidden=false;
 game.classList.remove("active");
 E("testStart").focus();
}
E("testStart").onclick=start;
E("restart").onclick=start;
E("mainMenu").onclick=toMenu;
E("sound").onclick=function(){
 soundOn=!soundOn;
 if(!soundOn)window.speechSynthesis?.cancel();
 this.textContent=soundOn?"🔊 SOUND ON":"🔇 SOUND OFF";
};
var paused=false, matchTimers=new Set();
function later(callback,delay){
 function run(){
   matchTimers.delete(timer);
   if(paused){later(callback,100);return}
   callback();
 }
 var timer=setTimeout(run,delay);
 matchTimers.add(timer);
}
function resetPause(){
 cancelDrag();
 window.speechSynthesis?.cancel();
 matchTimers.forEach(clearTimeout);matchTimers.clear();
 paused=false;E("board").inert=false;E("pause").textContent="PAUSE";
}
E("pause").onclick=function(){
 paused=!paused;cancelDrag();E("board").inert=paused;this.textContent=paused?"RESUME":"PAUSE";
};
function state(){
 return {status:disposed?"disposed":game.classList.contains("active")&&!paused?"running":"paused",soundOn,score,lives:0,round:1,done:score/10};
}
if(parent!==window)document.body.classList.add("embedded");
window.BTMatch={
 initialize(set){
   if(!Array.isArray(set.pairs)||set.pairs.length<4||!set.pairs.every(pair=>Array.isArray(pair)&&pair.length===2&&pair.every(word=>typeof word==="string"&&word.trim())))return false;
   vocab=set.pairs.map(([english,target],id)=>({id,english,target}));
   lang=set.language;
   document.querySelector(".colTitle").textContent=new Intl.DisplayNames(["en"],{type:"language"}).of(set.promptLanguage);
   E("targetTitle").textContent=new Intl.DisplayNames(["en"],{type:"language"}).of(lang);
   initialized=true;
   return true;
 },
 setShellManaged(value){document.body.classList.toggle("shell-managed",value);return true},
 subscribe(handler){if(subscriber)return false;subscriber=handler;return true},
 resume(){if(!initialized)return false;if(!game.classList.contains("active"))start();else if(paused)E("pause").click();return true},
 pause(){if(game.classList.contains("active")&&!paused)E("pause").click();return true},
 restart(){if(!initialized)return false;start();return true},
 setSound(value){if(typeof value!=="boolean")return false;if(soundOn!==value)E("sound").click();return true},
 resize(){},
 state,
 dispose(){disposed=true;resetPause();game.classList.remove("active");subscriber=null}
};
})();</script><script type="module" src="./bootstrap.mjs"></script></body></html>
